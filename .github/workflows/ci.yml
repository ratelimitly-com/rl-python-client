name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests setup.py

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.4

      # NARROWED, DELIBERATELY. This repo has never had a linter, so ruff's own
      # default rule set reports 84 pre-existing violations on main:
      #   62 FA100 (future-rewritable-type-annotation), 13 I001 (unsorted-imports),
      #    5 BLE001 (blind-except), 2 PYI034, 1 RUF022, 1 SIM117.
      # Those are style debt, not defects, and fixing them is not a CI change.
      # The selection below is the widest set that is genuinely clean on main --
      # pycodestyle errors (E4/E7/E9), all of pyflakes (F), pycodestyle warnings (W)
      # and flake8-bugbear (B) -- so this gate is real rather than permanently red.
      # E5 (line-too-long, 31 hits) is excluded: the repo has no agreed line length.
      # Widen this selection as the debt above is paid down.
      - name: Lint with ruff
        run: ruff check --select E4,E7,E9,F,W,B .

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.10"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit and loopback tests
        run: python -m unittest discover -s tests -v

  steering-platforms:
    name: steering (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run source-port steering regressions
        run: >-
          python -m unittest
          tests.test_steering
          tests.test_client.TestClient.test_keep_port_false_rebinds_persistent_socket
          -v

  c-reference:
    name: rl-c-client v0.6.0 differential conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Python client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned C reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ratelimitly-com/rl-c-client
          ref: a9cfc87e7eb90a99d77028b18d1079b301cf619c
          path: _reference/rl-c-client

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build C reference library
        run: make -C _reference/rl-c-client librclient.so

      - name: Compare IDs and wire bodies byte-for-byte
        env:
          RL_C_CLIENT_LIBRARY: ${{ github.workspace }}/_reference/rl-c-client/librclient.so
        run: python -m unittest tests.test_c_reference -v

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

  # The only job that talks to production. It is pinned to main because secrets
  # are unavailable to fork pull requests, and to a single actor on manual
  # dispatch because every run spends real tenant quota. It never shares a
  # concurrency group with anything else and is never cancelled mid-exchange.
  # tests/production_smoke.py is deliberately not a test_*.py module, so
  # `unittest discover` in the jobs above cannot reach production.
  production-smoke:
    name: Production protocol smoke
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'edescourtis'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rl-python-client-production-smoke
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The credential is a step-level environment variable so no other step can
      # observe it, and the probe never copies it into diagnostics. A missing
      # secret expands to an empty string and the probe exits non-zero: this job
      # must never report green without having reached production.
      - name: Prove key-only rate and latency behavior
        env:
          RATELIMITLY_AUTH_KEY: ${{ secrets.RATELIMITLY_AUTH_KEY }}
          RATELIMITLY_P0_TEST_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python tests/production_smoke.py
