name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.10"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit and loopback tests
        run: python -m unittest discover -s tests -v

  c-reference:
    name: rl-c-client v0.6.0 differential conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Python client
        uses: actions/checkout@v4

      - name: Check out pinned C reference
        uses: actions/checkout@v4
        with:
          repository: ratelimitly-com/rl-c-client
          ref: a9cfc87e7eb90a99d77028b18d1079b301cf619c
          path: _reference/rl-c-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build C reference library
        run: make -C _reference/rl-c-client librclient.so

      - name: Compare IDs and wire bodies byte-for-byte
        env:
          RL_C_CLIENT_LIBRARY: ${{ github.workspace }}/_reference/rl-c-client/librclient.so
        run: python -m unittest tests.test_c_reference -v

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
